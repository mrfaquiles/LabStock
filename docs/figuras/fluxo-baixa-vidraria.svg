<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1390" viewBox="0 0 960 1390" font-family="'Times New Roman', Times, serif" fill="#111"><defs><marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs><rect width="960" height="1390" fill="#fff"/><rect x="400" y="16" width="140" height="48" rx="24" fill="#dcdcdc" stroke="#111" stroke-width="2"/><text x="470" y="46.65" font-size="19" text-anchor="middle" font-weight="bold">Início</text><rect x="270" y="102" width="400" height="66" fill="#fff" stroke="#111" stroke-width="2"/><text x="470" y="130.05" font-size="18" text-anchor="middle">Usuário solicita a baixa: quantidade,</text><text x="470" y="152.55" font-size="18" text-anchor="middle">motivo e justificativa</text><polygon points="470,215 640,275 470,335 300,275" fill="#fff" stroke="#111" stroke-width="2"/><text x="470" y="270.325" font-size="17" text-anchor="middle">Dados válidos? (justificativa</text><text x="470" y="291.575" font-size="17" text-anchor="middle">com 10 caracteres ou mais)</text><polygon points="470,365 640,425 470,485 300,425" fill="#fff" stroke="#111" stroke-width="2"/><text x="470" y="420.325" font-size="17" text-anchor="middle">Quantidade menor ou</text><text x="470" y="441.575" font-size="17" text-anchor="middle">igual ao estoque?</text><polygon points="470,515 660,580 470,645 280,580" fill="#fff" stroke="#111" stroke-width="2"/><text x="470" y="575.325" font-size="17" text-anchor="middle">Solicitante é administrador</text><text x="470" y="596.575" font-size="17" text-anchor="middle">ou a aprovação está desligada?</text><rect x="280" y="692" width="380" height="66" fill="#fff" stroke="#111" stroke-width="2"/><text x="470" y="720.05" font-size="18" text-anchor="middle">Solicitação fica pendente;</text><text x="470" y="742.55" font-size="18" text-anchor="middle">o estoque não muda</text><rect x="280" y="810" width="380" height="50" fill="#fff" stroke="#111" stroke-width="2"/><text x="470" y="841.3" font-size="18" text-anchor="middle">Administrador analisa a solicitação</text><polygon points="470,900 640,960 470,1020 300,960" fill="#fff" stroke="#111" stroke-width="2"/><text x="470" y="955.325" font-size="17" text-anchor="middle">Administrador</text><text x="470" y="976.575" font-size="17" text-anchor="middle">aprova?</text><polygon points="470,1050 640,1110 470,1170 300,1110" fill="#fff" stroke="#111" stroke-width="2"/><text x="470" y="1105.325" font-size="17" text-anchor="middle">Quantidade ainda cabe</text><text x="470" y="1126.575" font-size="17" text-anchor="middle">no estoque atual?</text><rect x="280" y="1212" width="380" height="66" fill="#fff" stroke="#111" stroke-width="2"/><text x="470" y="1240.05" font-size="18" text-anchor="middle">Baixa aprovada:</text><text x="470" y="1262.55" font-size="18" text-anchor="middle">o estoque diminui</text><rect x="400" y="1326" width="140" height="48" rx="24" fill="#dcdcdc" stroke="#111" stroke-width="2"/><text x="470" y="1356.65" font-size="19" text-anchor="middle" font-weight="bold">Fim</text><rect x="665" y="1046" width="230" height="92" fill="#fff" stroke="#111" stroke-width="2"/><text x="780" y="1075.8" font-size="18" text-anchor="middle">Recusada: o estoque</text><text x="780" y="1098.3" font-size="18" text-anchor="middle">não muda e o registro</text><text x="780" y="1120.8" font-size="18" text-anchor="middle">fica no histórico</text><rect x="710" y="1166" width="140" height="48" rx="24" fill="#dcdcdc" stroke="#111" stroke-width="2"/><text x="780" y="1196.65" font-size="19" text-anchor="middle" font-weight="bold">Fim</text><rect x="20" y="550" width="200" height="300" fill="#f0f0f0" stroke="#111" stroke-width="2"/><text x="120" y="650.05" font-size="18" text-anchor="middle">Recusa a</text><text x="120" y="672.55" font-size="18" text-anchor="middle">operação e</text><text x="120" y="695.05" font-size="18" text-anchor="middle">informa o motivo</text><text x="120" y="717.55" font-size="18" text-anchor="middle">ao usuário.</text><text x="120" y="740.05" font-size="18" text-anchor="middle"></text><text x="120" y="762.55" font-size="18" text-anchor="middle">Nada é gravado.</text><polyline points="470,64 470,102" fill="none" stroke="#111" stroke-width="2" marker-end="url(#seta)"/><polyline points="470,168 470,215" fill="none" stroke="#111" stroke-width="2" marker-end="url(#seta)"/><polyline points="470,335 470,365" fill="none" stroke="#111" stroke-width="2" marker-end="url(#seta)"/><text x="480" y="357" font-size="16" font-style="italic">sim</text><polyline points="470,485 470,515" fill="none" stroke="#111" stroke-width="2" marker-end="url(#seta)"/><text x="480" y="507" font-size="16" font-style="italic">sim</text><polyline points="470,645 470,692" fill="none" stroke="#111" stroke-width="2" marker-end="url(#seta)"/><text x="480" y="667" font-size="16" font-style="italic">não</text><polyline points="470,758 470,810" fill="none" stroke="#111" stroke-width="2" marker-end="url(#seta)"/><polyline points="470,860 470,900" fill="none" stroke="#111" stroke-width="2" marker-end="url(#seta)"/><polyline points="470,1020 470,1050" fill="none" stroke="#111" stroke-width="2" marker-end="url(#seta)"/><text x="480" y="1042" font-size="16" font-style="italic">sim</text><polyline points="470,1170 470,1212" fill="none" stroke="#111" stroke-width="2" marker-end="url(#seta)"/><text x="480" y="1192" font-size="16" font-style="italic">sim</text><polyline points="470,1278 470,1326" fill="none" stroke="#111" stroke-width="2" marker-end="url(#seta)"/><polyline points="660,580 930,580 930,1245 660,1245" fill="none" stroke="#111" stroke-width="2" marker-end="url(#seta)"/><text x="672" y="572" font-size="16" font-style="italic">sim</text><polyline points="640,960 780,960 780,1046" fill="none" stroke="#111" stroke-width="2" marker-end="url(#seta)"/><text x="652" y="952" font-size="16" font-style="italic">não</text><polyline points="780,1138 780,1166" fill="none" stroke="#111" stroke-width="2" marker-end="url(#seta)"/><polyline points="300,275 250,275 250,570 220,570" fill="none" stroke="#111" stroke-width="2" marker-end="url(#seta)"/><text x="260" y="267" font-size="16" font-style="italic">não</text><polyline points="300,425 250,425 250,570 220,570" fill="none" stroke="#111" stroke-width="2" marker-end="url(#seta)"/><text x="260" y="417" font-size="16" font-style="italic">não</text><polyline points="300,1110 250,1110 250,830 220,830" fill="none" stroke="#111" stroke-width="2" marker-end="url(#seta)"/><text x="260" y="1102" font-size="16" font-style="italic">não</text></svg>