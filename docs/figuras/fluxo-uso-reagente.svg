<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1280" viewBox="0 0 920 1280" font-family="'Times New Roman', Times, serif" fill="#111"><defs><marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs><rect width="920" height="1280" fill="#fff"/><rect x="260" y="16" width="140" height="48" rx="24" fill="#dcdcdc" stroke="#111" stroke-width="2"/><text x="330" y="46.65" font-size="19" text-anchor="middle" font-weight="bold">Início</text><rect x="140" y="102" width="380" height="66" fill="#fff" stroke="#111" stroke-width="2"/><text x="330" y="130.05" font-size="18" text-anchor="middle">Usuário informa o reagente, o lote,</text><text x="330" y="152.55" font-size="18" text-anchor="middle">a quantidade e a justificativa</text><polygon points="330,217 495,275 330,333 165,275" fill="#fff" stroke="#111" stroke-width="2"/><text x="330" y="270.325" font-size="17" text-anchor="middle">Perfil é administrador</text><text x="330" y="291.575" font-size="17" text-anchor="middle">ou técnico?</text><polygon points="330,367 495,425 330,483 165,425" fill="#fff" stroke="#111" stroke-width="2"/><text x="330" y="420.325" font-size="17" text-anchor="middle">Dados válidos? (mín. 1 mg,</text><text x="330" y="441.575" font-size="17" text-anchor="middle">data não futura)</text><rect x="140" y="527" width="380" height="66" fill="#fff" stroke="#111" stroke-width="2"/><text x="330" y="555.05" font-size="18" text-anchor="middle">Inicia a transação e bloqueia</text><text x="330" y="577.55" font-size="18" text-anchor="middle">o reagente e o lote</text><polygon points="330,637 495,695 330,753 165,695" fill="#fff" stroke="#111" stroke-width="2"/><text x="330" y="690.325" font-size="17" text-anchor="middle">Justificativa válida?</text><text x="330" y="711.575" font-size="17" text-anchor="middle">(obrigatória se controlado)</text><polygon points="330,787 495,845 330,903 165,845" fill="#fff" stroke="#111" stroke-width="2"/><text x="330" y="840.325" font-size="17" text-anchor="middle">Lote na validade ou</text><text x="330" y="861.575" font-size="17" text-anchor="middle">uso confirmado?</text><polygon points="330,937 495,995 330,1053 165,995" fill="#fff" stroke="#111" stroke-width="2"/><text x="330" y="990.325" font-size="17" text-anchor="middle">Saldo do lote</text><text x="330" y="1011.575" font-size="17" text-anchor="middle">é suficiente?</text><rect x="140" y="1097" width="380" height="66" fill="#fff" stroke="#111" stroke-width="2"/><text x="330" y="1125.05" font-size="18" text-anchor="middle">Grava o uso, desconta o estoque</text><text x="330" y="1147.55" font-size="18" text-anchor="middle">e confirma a transação</text><rect x="260" y="1216" width="140" height="48" rx="24" fill="#dcdcdc" stroke="#111" stroke-width="2"/><text x="330" y="1246.65" font-size="19" text-anchor="middle" font-weight="bold">Fim</text><rect x="650" y="485" width="250" height="300" fill="#f0f0f0" stroke="#111" stroke-width="2"/><text x="775" y="573.8" font-size="18" text-anchor="middle">Recusa a operação</text><text x="775" y="596.3" font-size="18" text-anchor="middle">e informa o motivo</text><text x="775" y="618.8" font-size="18" text-anchor="middle">ao usuário.</text><text x="775" y="641.3" font-size="18" text-anchor="middle"></text><text x="775" y="663.8" font-size="18" text-anchor="middle">Nada é gravado:</text><text x="775" y="686.3" font-size="18" text-anchor="middle">a transação</text><text x="775" y="708.8" font-size="18" text-anchor="middle">é desfeita.</text><polyline points="330,64 330,102" fill="none" stroke="#111" stroke-width="2" marker-end="url(#seta)"/><polyline points="330,168 330,217" fill="none" stroke="#111" stroke-width="2" marker-end="url(#seta)"/><polyline points="330,333 330,367" fill="none" stroke="#111" stroke-width="2" marker-end="url(#seta)"/><text x="340" y="355" font-size="16" font-style="italic">sim</text><polyline points="330,483 330,527" fill="none" stroke="#111" stroke-width="2" marker-end="url(#seta)"/><text x="340" y="505" font-size="16" font-style="italic">sim</text><polyline points="330,753 330,787" fill="none" stroke="#111" stroke-width="2" marker-end="url(#seta)"/><text x="340" y="775" font-size="16" font-style="italic">sim</text><polyline points="330,903 330,937" fill="none" stroke="#111" stroke-width="2" marker-end="url(#seta)"/><text x="340" y="925" font-size="16" font-style="italic">sim</text><polyline points="330,593 330,637" fill="none" stroke="#111" stroke-width="2" marker-end="url(#seta)"/><polyline points="330,1053 330,1097" fill="none" stroke="#111" stroke-width="2" marker-end="url(#seta)"/><text x="340" y="1075" font-size="16" font-style="italic">sim</text><polyline points="330,1163 330,1216" fill="none" stroke="#111" stroke-width="2" marker-end="url(#seta)"/><polyline points="495,275 590,275 590,505 650,505" fill="none" stroke="#111" stroke-width="2" marker-end="url(#seta)"/><text x="507" y="267" font-size="16" font-style="italic">não</text><polyline points="495,425 590,425 590,505 650,505" fill="none" stroke="#111" stroke-width="2" marker-end="url(#seta)"/><text x="507" y="417" font-size="16" font-style="italic">não</text><polyline points="495,695 650,695" fill="none" stroke="#111" stroke-width="2" marker-end="url(#seta)"/><text x="507" y="687" font-size="16" font-style="italic">não</text><polyline points="495,845 620,845 620,765 650,765" fill="none" stroke="#111" stroke-width="2" marker-end="url(#seta)"/><text x="507" y="837" font-size="16" font-style="italic">não</text><polyline points="495,995 620,995 620,765 650,765" fill="none" stroke="#111" stroke-width="2" marker-end="url(#seta)"/><text x="507" y="987" font-size="16" font-style="italic">não</text></svg>